name: Desplegar Acordate en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests y empaquetado estático
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar tests unitarios
        run: npm test

      - name: Empaquetar carpeta estática para Pages
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js .nojekyll _site/
          cp -r assets styles vendor src _site/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Desplegar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Publicar sitio en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
